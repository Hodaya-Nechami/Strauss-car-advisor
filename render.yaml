# Render Blueprint: פריסת apps/web מה-Dockerfile הקיים, בתוכנית החינמית.
#
# בלי disk מתמיד (דורש תוכנית בתשלום): ה-DB של מאגר שווי השימוש נבנה מחדש
# אוטומטית מה-CSV בכל עליה של הקונטיינר (docker-entrypoint.sh). היסטוריית
# שיחות (chats.db) לא שורדת restart/redeploy בתוכנית הזו.
#
# שימוש: ב-Render dashboard -> New -> Blueprint -> לבחור את הריפו והענף הזה.
# מפתחות (GEMINI_API_KEY וכו') צריך למלא ידנית ב-dashboard אחרי היצירה (sync: false).

services:
  - type: web
    name: strauss-car-advisor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    envVars:
      - key: DB_PATH
        value: /app/.data/value-of-use.db
      - key: CHATS_DB_PATH
        value: /app/.data/chats.db
      - key: TRUST_PROXY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # בתשלום. עם LLM_PROVIDER=claude,openai הם ראשונים בתור, והחינמיים גיבוי
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: REP_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: REP_EMAILS
        sync: false
      # כניסה קבועה במייל וסיסמה (למשל לשופטים). המייל הזה נכנס גם למסך הנציג
      - key: LOGIN_EMAIL
        sync: false
      - key: LOGIN_PASSWORD
        sync: false
      # עובדים שמורשים להיכנס (דומיין עם @ או כתובות). ריק: כל חשבון Google
      - key: ALLOWED_EMAILS
        sync: false
      # הכתובת הציבורית של השירות (https://<השירות>.onrender.com), לקישורים במייל
      - key: AUTH_URL
        sync: false
      # שליחת מייל דרך Brevo (לא חובה). בלי שניהם, הכפתור פותח מייל מוכן אצל העובד
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
